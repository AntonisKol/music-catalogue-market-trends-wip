# The live setup on the server: the database, the web API and Caddy in front of it.
# Run from the project folder, so the settings come from its .env:
#   docker compose --env-file .env -f deploy/compose.yml up -d --build
# The nightly update and the backups are started by cron (deploy/crontab).
name: market-trends

# Container logs are kept up to this size, then the oldest is deleted.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging: *logging
    # Only the database's own settings, not the API keys.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: only the API and the nightly update reach the database.
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  api:
    build: ..
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_READER_USER: ${POSTGRES_READER_USER}
      POSTGRES_READER_PASSWORD: ${POSTGRES_READER_PASSWORD}
      POSTGRES_LIMITS_USER: ${POSTGRES_LIMITS_USER}
      POSTGRES_LIMITS_PASSWORD: ${POSTGRES_LIMITS_PASSWORD}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      VISITOR_HASH_SECRET: ${VISITOR_HASH_SECRET}
      QUESTIONS_PER_VISITOR_HOUR: ${QUESTIONS_PER_VISITOR_HOUR:-3}
      QUESTIONS_PER_VISITOR_DAY: ${QUESTIONS_PER_VISITOR_DAY:-3}
      QUESTIONS_PER_ACCOUNT_HOUR: ${QUESTIONS_PER_ACCOUNT_HOUR:-10}
      QUESTIONS_PER_ACCOUNT_DAY: ${QUESTIONS_PER_ACCOUNT_DAY:-50}
      QUESTIONS_PER_SITE_DAY: ${QUESTIONS_PER_SITE_DAY:-1000}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SIGN_IN_EMAIL_FROM: ${SIGN_IN_EMAIL_FROM:-Market Trends <sign-in@adnsaudio.com>}
      SIGN_IN_LOG_LINKS: ${SIGN_IN_LOG_LINKS:-false}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-}
      SIGN_IN_RETURN_URL: ${SIGN_IN_RETURN_URL:-https://adnsaudio.com/market-trends/}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      LABEL_REQUEST_NOTIFICATION_EMAIL: ${LABEL_REQUEST_NOTIFICATION_EMAIL:-}
      # Caddy is the one proxy in front of the API, so visitor addresses come from it.
      TRUSTED_PROXIES: "1"
    volumes:
      - ../logs:/app/logs
    depends_on:
      - db

  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.adnsaudio.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  caddy_data:
  caddy_config:
