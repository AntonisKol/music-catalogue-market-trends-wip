<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Market Trends question box (local demo)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="ask.css" />
  <style>
    /* The colours and fonts adnsaudio.com defines, so the demo looks like the real page. */
    :root {
      --ground: #07080b; --panel: #111318; --panel-raised: #181b21; --line: #30343b;
      --ink: #eceef2; --muted: #9aa0ad; --body: #c9cdd6;
      --trends: #392850; --trends-soft: #b19bdd; --trends-line: #403553;
      --sans: "Chakra Petch", system-ui, sans-serif; --mono: "Share Tech Mono", ui-monospace, monospace;
    }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 400 16px/1.6 var(--sans); }
    main { max-width: 1100px; margin: 0 auto; padding: 56px 24px; }
    .eyebrow { color: var(--trends-soft); font: 11px var(--mono); letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0 12px; font-size: clamp(32px, 5vw, 52px); line-height: 1.1; }
    .lead { max-width: 640px; color: var(--muted); font-size: 18px; margin-bottom: 32px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Catalogue research</div>
    <h1>Catalogue / Market Trends</h1>
    <p class="lead">Ask about prices and demand for vinyl on the labels this site tracks.</p>
    <!-- 1x00000000000000000000AA is Cloudflare's test site key that always passes. -->
    <div class="mt-ask" data-api="http://127.0.0.1:5000" data-turnstile-sitekey="1x00000000000000000000AA"></div>
  </main>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>
  <script type="module" src="ask.js"></script>
</body>
</html>
